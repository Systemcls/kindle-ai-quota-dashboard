<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dashboard-layout" content="kindle-table-v1">
<title>Kindle AI Quota Dashboard</title>
<style>
:root {
  --bg: #FFFFFF; --fg: #000000; --mid: #444444; --light: #666666;
  --faint: #999999; --border: #AAAAAA; --border-light: #CCCCCC;
  --bar-bg: #DDDDDD; --bar-fill: #333333; --card-bg: #F8F8F8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181818; --fg: #E0E0E0; --mid: #AAAAAA; --light: #777777;
    --faint: #444444; --border: #333333; --border-light: #282828;
    --bar-bg: #2A2A2A; --bar-fill: #AAAAAA; --card-bg: #1E1E1E;
  }
}
:root[data-theme="dark"] {
  --bg: #181818; --fg: #E0E0E0; --mid: #AAAAAA; --light: #777777;
  --faint: #444444; --border: #333333; --border-light: #282828;
  --bar-bg: #2A2A2A; --bar-fill: #AAAAAA; --card-bg: #1E1E1E;
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --fg: #000000; --mid: #444444; --light: #666666;
  --faint: #999999; --border: #AAAAAA; --border-light: #CCCCCC;
  --bar-bg: #DDDDDD; --bar-fill: #333333; --card-bg: #F8F8F8;
}
* { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
body {
  font-family: Georgia, 'Noto Serif SC', 'SimSun', serif;
  background: #FFFFFF; background: var(--bg); color: #000000; color: var(--fg);
  width: 100%; max-width: 600px; min-height: 800px; margin: 0 auto;
  padding: 24px 24px 16px;
}
.sans { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; }
.mono { font-family: 'Consolas', 'Courier New', monospace; font-variant-numeric: tabular-nums; }

/* ===== Top: DateTime + Weather ===== */
.top-row {
  width: 100%; table-layout: fixed; border-collapse: collapse;
  margin-bottom: 20px;
}
.layout-cell { width: 50%; vertical-align: top; }
.layout-left { padding-right: 7px; }
.layout-right { padding-left: 7px; }
.layout-bottom { padding-top: 14px; }
.weather-card, .datetime-card {
  background: #F8F8F8; background: var(--card-bg); border: 1px solid #CCCCCC; border: 1px solid var(--border-light); padding: 14px 16px;
}

/* DateTime card */
.dt-time { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
.dt-meta { margin-top: 8px; }
.dt-meta span { display: inline-block; vertical-align: middle; }
.dt-meta .dt-date { margin-right: 8px; }
.dt-date { font-size: 15px; color: #444444; color: var(--mid); }
.dt-week { font-size: 14px; color: #666666; color: var(--light); }
.dt-battery { font-size: 13px; color: #666666; color: var(--light); margin-top: 6px; }
.dt-battery svg { width: 16px; height: 12px; vertical-align: middle; margin-right: 4px; }

/* Weather card */
.w-row { margin-bottom: 4px; }
.w-row span { display: inline-block; vertical-align: middle; }
.w-row .w-icon { margin-left: 10px; }
.w-temp { font-size: 40px; font-weight: 700; line-height: 1; }
.w-icon { color: #444444; color: var(--mid); }
.w-icon svg { width: 30px; height: 30px; }
.w-detail { font-size: 13px; color: #666666; color: var(--light); line-height: 1.7; }
.w-credit { font-size: 11px; line-height: 1.6; color: #666666; }
.w-credit a { color: inherit; }

/* ===== Quote ===== */
.quote {
  text-align: center; padding: 16px 24px;
  border: 1px solid #CCCCCC; border: 1px solid var(--border-light); position: relative;
  margin-bottom: 20px;
}
.quote::before, .quote::after {
  position: absolute; font-size: 28px; color: #999999; color: var(--faint); font-family: Georgia, serif; line-height: 1;
}
.quote::before { content: '\201C'; top: 6px; left: 12px; }
.quote::after { content: '\201D'; bottom: 2px; right: 12px; }
.quote-text { font-size: 19px; line-height: 1.8; font-style: italic; margin-bottom: 4px; }
.quote-src { font-size: 12px; color: #666666; color: var(--light); letter-spacing: 0.05em; }

/* ===== Quota cards ===== */
.quota-grid {
  width: 100%; table-layout: fixed; border-collapse: collapse;
}
.q-card {
  background: #F8F8F8; background: var(--card-bg); border: 1px solid #CCCCCC; border: 1px solid var(--border-light);
  padding: 12px 14px;
}
.q-head {
  margin-bottom: 10px;
}
.q-head svg { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }
.q-name { display: inline-block; vertical-align: middle; font-size: 17px; font-weight: 600; }

/* Single bar row */
.q-row { margin-bottom: 8px; }
.q-row:last-child { margin-bottom: 0; }
.q-label {
  position: relative; padding-right: 50px; min-height: 16px; margin-bottom: 3px;
  font-size: 11px; color: #666666; color: var(--light); letter-spacing: 0.06em;
}
.q-label .q-pct { position: absolute; top: 0; right: 0; color: #444444; color: var(--mid); font-size: 13px; font-weight: 600; }
.q-bar { height: 8px; background: #DDDDDD; background: var(--bar-bg); width: 100%; }
.q-bar-fill { height: 100%; background: #333333; background: var(--bar-fill); }
.q-refresh { font-size: 11px; color: #999999; color: var(--faint); margin-top: 2px; letter-spacing: 0.03em; }

.q-card { min-height: 180px; }
.q-refresh { color: #666666; color: var(--light); line-height: 1.6; }
@media (max-width: 420px) {
  body { padding: 12px; }
  .q-card, .weather-card, .datetime-card { padding: 10px; }
  .q-name { font-size: 15px; }
  .layout-left { padding-right: 5px; }
  .layout-right { padding-left: 5px; }
}

/* DeepSeek balance */
.q-balance { font-size: 24px; font-weight: 700; margin: 6px 0 4px; }
.q-balance-unit { font-size: 12px; font-weight: 400; color: #666666; color: var(--light); }
.q-balance-sub { font-size: 11px; color: #999999; color: var(--faint); }

/* ===== Footer ===== */
.footer {
  margin-top: 16px; display: table; width: 100%; table-layout: fixed;
  padding-top: 8px; border-top: 1px solid #AAAAAA; border-top: 1px solid var(--border);
  font-size: 11px; color: #666666; color: var(--light);
}
.footer > span { display: table-cell; vertical-align: middle; }
.footer #dataStatus { text-align: right; }
.data-alert {
  display: none; margin: -10px 0 12px; padding: 6px 10px;
  border: 2px solid #000; text-align: center;
  font: 700 13px/1.3 Arial, 'Microsoft YaHei', sans-serif;
  color: #000; background: #fff;
}
.data-alert.on { display: block; }
.footer .warn { color: #000; font-weight: 700; }
</style>
</head>
<body>

<!-- ===== Top: DateTime + Weather ===== -->
<!-- Tables keep two columns even on Kindle browsers without Grid or Flexbox. -->
<table class="top-row" role="presentation"><tbody><tr>
  <td class="layout-cell layout-left">
  <div class="datetime-card">
    <div class="dt-time mono" id="dtTime">--:--</div>
    <div class="dt-meta">
      <span class="dt-date sans" id="dtDate">----年--月--日</span>
      <span class="dt-week sans" id="dtWeek">---</span>
    </div>
    <div class="dt-battery sans" id="dtBattery" style="display:none">
      <svg viewBox="-0.5 0 28 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="0" y="1" width="22" height="12" rx="2"/><rect x="22" y="4" width="3" height="6" rx="1"/><rect x="2" y="3" width="11" height="8" fill="currentColor" stroke="none" id="batFill"/></svg>
      <span id="batPct">--%</span>
    </div>
  </div>

  </td>
  <td class="layout-cell layout-right">
  <div class="weather-card">
    <div class="w-row">
      <span class="w-temp" id="weatherTemp">--°</span>
      <span class="w-icon" id="weatherIcon"></span>
    </div>
    <div class="w-detail sans" id="weatherDetail">天气未配置</div>
    <div class="w-credit sans">天气数据：<a href="https://open-meteo.com/">Open-Meteo</a></div>
  </div>
  </td>
</tr></tbody></table>

<div class="data-alert" id="dataAlert"></div>

<!-- ===== Quote ===== -->
<div class="quote" style="display:none">
  <div class="quote-text" id="quoteText"></div>
  <div class="quote-src sans" id="quoteSrc"></div>
</div>

<!-- ===== AI Quotas ===== -->
<table class="quota-grid" role="presentation"><tbody><tr>
  <td class="layout-cell layout-left">
  <!-- GPT / Codex -->
  <div class="q-card" id="cardCodex">
    <div class="q-head">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M11.745 14.85L6.905 12V7c0-2.21 1.824-4 4.076-4c1.397 0 2.63.69 3.365 1.741"/><path d="M9.6 19.18A4.1 4.1 0 0 0 13.02 21c2.25 0 4.076-1.79 4.076-4v-5L12.16 9.097"/><path d="M9.452 13.5V7.67l4.412-2.5c1.95-1.105 4.443-.45 5.569 1.463a3.93 3.93 0 0 1 .076 3.866"/><path d="M4.49 13.5a3.93 3.93 0 0 0 .075 3.866c1.126 1.913 3.62 2.568 5.57 1.464l4.412-2.5l.096-5.596"/><path d="M17.096 17.63a4.09 4.09 0 0 0 3.357-1.996c1.126-1.913.458-4.36-1.492-5.464l-4.413-2.5l-5.059 2.755"/><path d="M6.905 6.37a4.09 4.09 0 0 0-3.358 1.996c-1.126 1.914-.458 4.36 1.492 5.464l4.413 2.5l5.048-2.75"/></g></svg>
      <span class="q-name sans">Codex</span>
    </div>
    <div class="q-row">
      <div class="q-label sans"><span>5H QUOTA</span><span class="q-pct mono">--</span></div>
      <div class="q-bar"><div class="q-bar-fill" style="width:0%"></div></div>
      <div class="q-refresh sans">等待采集</div>
    </div>
    <div class="q-row">
      <div class="q-label sans"><span>WEEKLY</span><span class="q-pct mono">--</span></div>
      <div class="q-bar"><div class="q-bar-fill" style="width:0%"></div></div>
      <div class="q-refresh sans">等待采集</div>
    </div>
  </div>

  </td>
  <td class="layout-cell layout-right">
  <!-- GLM Coding Plan -->
  <div class="q-card" id="cardGlm">
    <div class="q-head">
      <span class="q-name sans">GLM Coding Plan</span>
    </div>
    <div class="q-row">
      <div class="q-label sans"><span>5H QUOTA</span><span class="q-pct mono">--</span></div>
      <div class="q-bar"><div class="q-bar-fill" style="width:0%"></div></div>
      <div class="q-refresh sans">等待采集</div>
    </div>
    <div class="q-row">
      <div class="q-label sans"><span>WEEKLY</span><span class="q-pct mono">--</span></div>
      <div class="q-bar"><div class="q-bar-fill" style="width:0%"></div></div>
      <div class="q-refresh sans">等待采集</div>
    </div>
    <div class="q-row">
      <div class="q-label sans"><span>MONTHLY</span><span class="q-pct mono">--</span></div>
      <div class="q-bar"><div class="q-bar-fill" style="width:0%"></div></div>
      <div class="q-refresh sans">等待采集</div>
    </div>
  </div>

  </td>
</tr><tr>
  <td colspan="2" class="layout-bottom">
  <!-- DeepSeek -->
  <div class="q-card" id="cardDeepSeek">
    <div class="q-head">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="M23.75 4.927c-.245-.12-.34.108-.482.224c-.049.038-.09.087-.131.13c-.357.384-.773.634-1.315.604c-.796-.044-1.474.207-2.074.818c-.127-.754-.551-1.203-1.195-1.492c-.338-.15-.68-.3-.915-.626c-.165-.231-.21-.49-.293-.744c-.052-.153-.105-.31-.28-.337c-.192-.03-.266.13-.341.265c-.3.55-.416 1.158-.406 1.772c.027 1.382.608 2.482 1.762 3.266c.132.09.166.18.124.311c-.079.27-.172.531-.255.8c-.052.173-.13.211-.314.135A5.3 5.3 0 0 1 15.97 8.92c-.82-.797-1.563-1.677-2.489-2.366a11 11 0 0 0-.66-.454c-.944-.922.125-1.679.372-1.768c.259-.093.09-.416-.747-.412c-.835.004-1.6.285-2.574.659c-.143.057-.326.153-.446.13a9.2 9.2 0 0 0-2.763-.096c-1.806.203-3.25 1.06-4.31 2.525c-1.275 1.76-1.574 3.759-1.207 5.846c.385 2.197 1.502 4.019 3.22 5.442c1.78 1.474 3.83 2.197 6.169 2.058c1.42-.081 3.003-.273 4.786-1.789c.45.224.922.313 1.707.381c.603.057 1.184-.03 1.634-.123c.704-.15.655-.804.4-.926c-2.065-.966-1.612-.573-2.024-.89c1.05-1.248 2.632-2.544 3.25-6.741c.049-.334.007-.543 0-.814c-.003-.163.034-.228.22-.247a4 4 0 0 0 1.482-.457c1.338-.734 1.867-1.939 1.995-3.385c.019-.22-.004-.45-.236-.565"/></svg>
      <span class="q-name sans">DeepSeek</span>
    </div>
    <div class="q-balance mono"><span id="deepSeekBalance">¥ --</span> <span class="q-balance-unit sans">API 余额</span></div>
    <div class="q-balance-sub sans" id="deepSeekDetail">等待实时数据</div>
  </div>
  </td>
</tr></tbody></table>

<!-- ===== Footer ===== -->
<div class="footer sans">
  <span>Kindle AI Quota Dashboard</span>
  <span id="dataStatus">等待实时数据</span>
</div>

<script src="data.js"></script>
<script src="weather.js"></script>
<script src="live-endpoint.js"></script>
<script src="dashboard-runtime.js?v=20260909-weather1"></script>
</body>
</html>
